# VPS: Flask only — DB on Tiger Cloud (set DB_* in .env).
services:
  ai-trader:
    build: .
    restart: unless-stopped
    ports:
      - "5050:5050"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/state', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
