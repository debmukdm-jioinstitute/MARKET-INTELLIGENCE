name: cron-data360

# Moved off Vercel (Fluid Active CPU over quota). Syncs World Bank Data360
# observations into Neon on the GitHub Actions runner — zero Vercel compute.
# Same UTC schedule the old vercel.json cron used: daily 03:45 UTC
# (09:15 IST). Resumable; the runner budget (10 min) lets one run make real
# progress through the backlog.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

jobs:
  data360:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Data360 observations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-data360.ts
