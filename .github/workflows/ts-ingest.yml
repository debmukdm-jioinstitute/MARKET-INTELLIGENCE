name: ts-ingest

# TipSheet-grade data ingestion (CLAUDE_BUILD_SPEC §5). One generic runner; schedule selects sources.
# Sources without a parser yet are logged as "no parser yet" and skipped (never faked).
#
# REQUIRED SECRETS: DATABASE_URL (preflight), CRON_SECRET, SITE_URL (optional, defaults to prod), FRED_API_KEY (fred_* sources)

on:
  schedule:
    - cron: "0 14 * * 1-5"    # 19:30 IST
    - cron: "30 15 * * 1-5"   # 21:00 IST
    - cron: "0 18 * * 1-5"    # 23:30 IST catch-up
    - cron: "0 18 * * *"      # 23:30 IST daily
    - cron: "30 4 * * 6"      # Sat 10:00 IST
    - cron: "30 5 1-15 * *"   # monthly
    - cron: "30 5 25-31 * *"  # month end
    - cron: "0 6 5 1,4,7,10 *" # quarterly
    - cron: "30 2 * * *"      # 08:00 IST health
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source ids or datasets"
        required: false
      since:
        description: "Backfill start YYYY-MM-DD (per-date sources)"
        required: false

concurrency:
  group: ts-ingest-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          test -n "${CRON_SECRET}" || { echo "::error::CRON_SECRET secret is not set"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci

      - name: Map schedule to sources
        id: map
        run: |
          case "${{ github.event.schedule }}" in
            "0 14 * * 1-5")    ONLY="nse_bhavcopy,nse_indexhistory,nse_allindices,nse_fiidii,nse_participant_oi" ;;
            "30 15 * * 1-5")   ONLY="nse_mtf,nse_corp_actions,nse_ipo_past,nse_wdm,nse_cbm" ;;
            "0 18 * * 1-5")    ONLY="nse_bhavcopy,nse_mtf" ;;
            "0 18 * * *")      ONLY="amfi_nav,ecb,fred,wgc_gold" ;;
            "30 4 * * 6")      ONLY="nsdl_fpi,rbi_wss,bis,nse_holidays" ;;
            "30 5 1-15 * *")   ONLY="amfi_monthly,amfi_sip,nsdl_depo,cdsl_bo,nse_business_growth,mospi,nse_ucc" ;;
            "30 5 25-31 * *")  ONLY="rbi_dbie,sebi_bulletin,nse_market_pulse" ;;
            "0 6 5 1,4,7,10 *") ONLY="imf,worldbank" ;;
            "30 2 * * *")      ONLY="--health" ;;
            *)                 ONLY="${{ inputs.only }}" ;;
          esac
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

      - name: Run ts-ingest
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://getmarketintelligence.in' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          ARGS="--only=${{ steps.map.outputs.only }}"
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since=${{ inputs.since }}"
          npx --yes tsx@4 scripts/ts-ingest/run.ts $ARGS
