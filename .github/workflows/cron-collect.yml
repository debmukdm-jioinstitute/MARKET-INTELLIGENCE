name: cron-collect

# Moved off Vercel (Fluid Active CPU over quota). Runs the full collector
# pipeline into Neon on the GitHub Actions runner — zero Vercel compute.
# Same UTC schedule the old vercel.json cron used: daily 03:15 UTC
# (08:45 IST). This is the full scheduled run (no ?only subset, no ?dry=1
# validation-only). Subset/dry runs stay manual via the /api/cron/collect
# route.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set (repo Settings → Secrets and variables → Actions)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run collector pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-collect.ts
