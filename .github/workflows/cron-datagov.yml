name: cron-datagov

# Moved off Vercel (Fluid Active CPU over quota). Syncs data.gov.in tracked
# datasets into Neon on the GitHub Actions runner — zero Vercel compute.
# Same UTC schedule the old vercel.json cron used: daily 02:30 UTC
# (08:00 IST). Catalog/discover modes stay manual via the API route.
#
# Like the old route (which returns 503 without a key), the runner exits 1
# unless DATA_GOV_IN_API_KEY holds a personal key — row sync genuinely needs
# one and the runner does not fake it. Provide it via the repo's Actions
# secrets/variables; the workflow intentionally does NOT reference any secret
# by name.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL         Neon connection string (POSTGRES_URL also accepted)
#   DATA_GOV_IN_API_KEY  personal key (required — runner fails loudly without it)

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  datagov:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync data.gov.in datasets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-datagov.ts
