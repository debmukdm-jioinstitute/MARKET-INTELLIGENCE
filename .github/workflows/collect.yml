name: collect-market-data

# Every 3 hours. GitHub Actions is used because Vercel Hobby crons are limited to once a day.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger collector
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -m 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL:-https://getmarketintelligence.vercel.app}/api/cron/collect"
      - name: Snapshot stress index and evaluate alerts
        if: always()
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -m 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL:-https://getmarketintelligence.vercel.app}/api/cron/stress"
