name: cron-backtest

# Moved off Vercel (Fluid Active CPU over quota). Backtests every scanner over
# ~2 years of Nifty 500 daily bars and stores the result in Neon via the
# shared lib code — zero Vercel compute. Same UTC schedule the old vercel.json
# cron used: Saturdays 12:00 UTC (17:30 IST).
#
# Guard: if the run covered fewer than 300 symbols, fail loudly and do NOT
# save — keeping the previous backtest instead of a partial one.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)

on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scanner backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-backtest.ts
