name: cron-52w-levels

# Moved off Vercel (Fluid Active CPU over quota). Refreshes per-stock 52W
# high/low into Neon on the GitHub Actions runner — zero Vercel compute.
# Same UTC schedule the old vercel.json cron used: weekdays 10:05 UTC
# (15:35 IST, after NSE close). The refresh is resumable and uses the same
# 280-second budget the Vercel route used.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)

on:
  schedule:
    - cron: "5 10 * * 1-5"
  workflow_dispatch:

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh 52-week levels
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-52w-levels.ts
