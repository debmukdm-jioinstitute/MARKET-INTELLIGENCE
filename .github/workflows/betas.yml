name: refresh-factor-betas

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  betas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recompute sector betas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -m 90 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL:-https://getmarketintelligence.in}/api/cron/betas")
          cat /tmp/out.json; echo
          test "$code" = "200"
