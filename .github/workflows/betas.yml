name: refresh-factor-betas

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  betas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recompute sector betas
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS -m 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL:-https://getmarketintelligence.vercel.app}/api/cron/betas"
