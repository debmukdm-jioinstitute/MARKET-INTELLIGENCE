name: cron-instruments-sync

# Moved off Vercel (Fluid Active CPU over quota). Syncs the NSE instrument
# master into Neon on the GitHub Actions runner — zero Vercel compute.
# Same UTC schedule the old vercel.json cron used: Mondays 03:00 UTC
# (08:30 IST).
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync NSE instruments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-instruments-sync.ts
