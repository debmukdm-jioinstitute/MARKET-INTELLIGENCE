name: cron-signals

# Moved off Vercel (Fluid Active CPU over quota). Runs the Nifty next-day/5-day
# model with walk-forward validation plus Nifty 500 BTST/STBT candidates, then
# saves the run to Neon — or, when coverage is thin, merges just the F&O
# indices into the previous run so a bad session never wipes a good signals
# table. All via the shared lib code — zero Vercel compute. Same UTC schedule
# the old vercel.json cron used: weekdays 11:45 UTC (17:15 IST, after NSE
# close).
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)

on:
  schedule:
    - cron: "45 11 * * 1-5"
  workflow_dispatch:

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI signals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-signals.ts
