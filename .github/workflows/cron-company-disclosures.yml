name: cron-company-disclosures

# Moved off Vercel (Fluid Active CPU over quota). Crawls NSE corporate
# announcements, enriches with FinBERT, and upserts into Neon on the GitHub
# Actions runner — zero Vercel compute. Same UTC schedule the old vercel.json
# cron used: daily 06:00 UTC (11:30 IST). The
# /api/cron/company-disclosures route stays as a manual fallback.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)
# HF_TOKEN is optional — the HF lib works without it.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  company-disclosures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set (repo Settings → Secrets and variables → Actions)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl company disclosures
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-company-disclosures.ts
