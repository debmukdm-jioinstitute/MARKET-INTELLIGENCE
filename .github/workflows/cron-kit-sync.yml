name: cron-kit-sync

# Moved off Vercel (Fluid Active CPU over quota). Tags untagged users with
# the Kit `customers` tag on the GitHub Actions runner — zero Vercel compute.
# Same UTC schedule the old vercel.json cron used: daily 05:30 UTC
# (11:00 IST). The /api/cron/kit-sync-customers route stays as a manual
# fallback.
#
# IMPORTANT: this job genuinely needs KIT_API_KEY at runtime, but KIT_API_KEY
# is NOT among the secrets currently available to these workflows (only
# DATABASE_URL / CRON_SECRET / TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are).
# Until a KIT_API_KEY Actions secret is provisioned (and passed to the
# runner env below), the runner fails fast with a clear message. KIT_API_KEY
# is intentionally NOT referenced here because it does not exist yet.
#
# REQUIRED SECRETS — repo Settings → Secrets and variables → Actions:
#   DATABASE_URL  Neon connection string (POSTGRES_URL also accepted)
#   KIT_API_KEY   Kit API key — REQUIRED for this job, but not yet provisioned

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  kit-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "${DATABASE_URL}" || { echo "::error::DATABASE_URL secret is not set (repo Settings → Secrets and variables → Actions)"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Kit customers tag
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx --yes tsx@4 scripts/crons/run-kit-sync.ts
